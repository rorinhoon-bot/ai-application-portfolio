name: p1-ci

on:
  push:
    paths:
      - ".github/workflows/p1-ci.yml"
      - "projects/01-cited-rag/**"
      - "portfolio-site/p1/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-offline:
    name: Windows offline contract
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/01-cited-rag
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up CPython 3.14.3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.3"

      - name: Install exact development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run fixed offline smoke
        run: python scripts/run_ci_smoke.py

      - name: Run bounded retry fake smoke
        run: python scripts/run_retry_smoke.py

      - name: Check static evidence export
        run: python scripts/export_portfolio_evidence.py --check

      - name: Run full offline test suite
        run: python -m pytest -q

      - name: Check tracked-file boundaries
        run: python scripts/check_git_boundaries.py

      - name: Check patch whitespace
        run: git diff --check

  linux-image-contract:
    name: Linux API image contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/01-cited-rag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build fixed API image without services or push
        run: docker build --tag cited-rag-api:ci --file deploy/Dockerfile.api .

      - name: Inspect image contract
        run: >-
          docker image inspect cited-rag-api:ci
          --format 'id={{.Id}} size={{.Size}} os={{.Os}} arch={{.Architecture}} user={{.Config.User}}'
