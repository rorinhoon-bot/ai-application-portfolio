[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cited-rag"
version = "0.2.0"
description = "Version-aware RAG service with verifiable citations."
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastapi==0.141.1",
    "fastembed==0.8.0",
    "httpx==0.28.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "qdrant-client==1.18.0",
    "streamlit==1.60.0",
    "uvicorn==0.51.0",
]

[project.scripts]
cited-rag = "cited_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
