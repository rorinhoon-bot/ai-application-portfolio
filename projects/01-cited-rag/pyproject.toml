[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cited-rag"
version = "0.1.0"
description = "Local RAG CLI for answering questions with verifiable citations."
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4==4.15.0",
    "fastembed==0.8.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "qdrant-client==1.18.0",
]

[project.scripts]
cited-rag = "cited_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
